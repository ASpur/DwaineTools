<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link id="theme-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const fallbackTheme = 'thinktronic';
        const validThemes = new Set(['thinktronic', 'amber', 'blue', 'syndicate']);
        const savedTheme = localStorage.getItem('dwaine_theme');
        document.documentElement.dataset.theme = validThemes.has(savedTheme) ? savedTheme : fallbackTheme;
      })();
    </script>
    <title>dwainetools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
